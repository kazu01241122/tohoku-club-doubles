<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>東北大クラブダブルス乱数表</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}

.wrap{
  max-width:700px;
  margin:auto;
  padding:16px 14px 40px
}

.hero{
  background:#111827;
  color:white;
  border-radius:22px;
  padding:21px 19px;
  margin-bottom:13px
}

h1{
  font-size:22px;
  margin:0 0 5px
}

.sub{
  font-size:13px;
  opacity:.8
}

.card{
  background:white;
  border-radius:18px;
  padding:17px;
  margin:12px 0;
  box-shadow:0 2px 10px #0000000a
}

h2{
  font-size:17px;
  margin:0
}

.chips{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px
}

.chip{
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:12px;
  padding:12px 5px;
  font-weight:800;
  font-size:15px
}

.chip.on{
  background:#111827;
  color:#fff;
  border-color:#111827
}

button{
  font-family:inherit;
  cursor:pointer
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 15px;
  font-weight:800;
  font-size:14px
}

.primary{
  background:#111827;
  color:#fff;
  width:100%;
  margin-top:13px
}

.secondary{
  background:#e5e7eb;
  color:#111827
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.muted{
  font-size:12px;
  color:#6b7280;
  line-height:1.6;
  margin-top:8px
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.stat{
  font-size:13px;
  color:#6b7280
}


/* =========================
   試合数希望
========================= */

.preference-title{
  margin-top:16px;
  font-weight:800;
  font-size:14px
}

.preference-list{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:9px
}

.preference{
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:12px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.preference-name{
  font-weight:800;
  font-size:14px
}

.preference-buttons{
  display:flex;
  gap:4px
}

.pref-btn{
  border:1px solid #d1d5db;
  background:#f9fafb;
  border-radius:8px;
  padding:6px 8px;
  font-size:11px;
  font-weight:800;
  color:#6b7280
}

.pref-btn.active-light{
  background:#f59e0b;
  border-color:#f59e0b;
  color:#fff
}

.pref-btn.active-normal{
  background:#111827;
  border-color:#111827;
  color:#fff
}

.pref-btn.active-heavy{
  background:#2563eb;
  border-color:#2563eb;
  color:#fff
}


/* =========================
   試合表示
========================= */

.match{
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:13px;
  margin-top:10px
}

.match-title{
  font-weight:900;
  margin-bottom:10px
}

.court{
  display:grid;
  grid-template-columns:1fr 28px 1fr;
  align-items:center;
  gap:7px
}

.team{
  background:#f9fafb;
  border-radius:11px;
  padding:12px 6px;
  text-align:center;
  font-weight:900
}

.vs{
  text-align:center;
  color:#9ca3af;
  font-weight:900
}

.bye{
  font-size:12px;
  color:#6b7280;
  margin-top:9px
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:16px 0
}

.history{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px
}

.pill{
  background:#f3f4f6;
  border-radius:999px;
  padding:6px 9px;
  font-size:12px
}

@media(min-width:520px){

  .chips{
    grid-template-columns:repeat(6,1fr)
  }

  .preference-list{
    grid-template-columns:1fr 1fr
  }

}
</style>
</head>


<body>

<div class="wrap">

  <!-- ヘッダー -->

  <div class="hero">

    <h1>🏸 東北大クラブダブルス乱数表</h1>

    <div class="sub">
      今日の中で「ペア・対戦・休み」が偏らないように自動調整
    </div>

  </div>


  <!-- 設定 -->

  <div class="card">

    <div class="topline">

      <h2>① 参加者を選択</h2>

      <span id="count" class="stat">
        0人
      </span>

    </div>


    <div id="chips" class="chips"></div>


    <div class="muted">
      4〜12人。参加者を変えると当日の記録はリセットされます。
    </div>


    <!-- 試合数希望 -->

    <div class="preference-title">
      ② 試合数の希望
    </div>

    <div class="muted">
      普段は全員「普通」のままでOK。
      怪我などで出場を減らしたい人は「少なめ」、
      たくさん出たい人は「多め」にしてください。
    </div>


    <div id="preferences" class="preference-list"></div>


    <!-- コート数 -->

    <div style="margin-top:14px;font-weight:800;font-size:14px">
      ③ コート数
    </div>

    <div style="display:flex;gap:8px;margin-top:8px">

      <button
        type="button"
        id="court1"
        class="btn secondary"
        onclick="setCourts(1)"
      >
        1コート
      </button>

      <button
        type="button"
        id="court2"
        class="btn secondary"
        onclick="setCourts(2)"
      >
        2コート
      </button>

    </div>


    <button
      type="button"
      class="btn primary"
      onclick="nextMatch()"
    >
      🏸 次の試合を作る
    </button>

  </div>


  <!-- 結果 -->

  <div class="card">

    <div class="topline">

      <h2>④ 今日の組み合わせ</h2>

      <button
        type="button"
        class="btn danger"
        onclick="resetDay()"
      >
        リセット
      </button>

    </div>


    <div id="result" class="empty">
      参加者を選んで「次の試合を作る」を押してください。
    </div>

  </div>

</div>


<script>

/* =========================
   データ
========================= */

let selected = new Set();

let rounds = [];

let pairCounts = {};

let oppCounts = {};

let playCounts = {};

let byeCounts = {};

/*
 * 試合数希望
 *
 * light  = 少なめ
 * normal = 普通
 * heavy  = 多め
 */

let preferences = {};

let courtCount = 1;


/* =========================
   DOM
========================= */

const chips =
  document.getElementById('chips');

const preferencesBox =
  document.getElementById('preferences');


/* =========================
   人数ボタン
========================= */

for(let n=4;n<=12;n++){

  const b=document.createElement('button');

  b.type='button';

  b.className='chip';

  b.textContent=n+'人';


  b.addEventListener('click',()=>{

    selected=new Set();

    for(let i=1;i<=n;i++){

      selected.add(i);

    }


    document
      .querySelectorAll('.chip')
      .forEach(x=>{
        x.classList.remove('on');
      });


    b.classList.add('on');


    document
      .getElementById('count')
      .textContent=n+'人';


    /*
     * 新しい人数を選んだら
     * 全員「普通」に戻す
     */

    preferences={};


    for(let i=1;i<=n;i++){

      preferences[i]='normal';

    }


    resetRecords();

    renderPreferences();

  });


  chips.appendChild(b);

}


/* =========================
   初期コート
========================= */

setCourts(1);


/* =========================
   ペアキー
========================= */

function key(a,b){

  return [a,b]
    .sort((x,y)=>x-y)
    .join('-');

}


/* =========================
   シャッフル
========================= */

function shuffle(a){

  a=a.slice();

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];

  }

  return a;

}


/* =========================
   コート変更
========================= */

function setCourts(n){

  courtCount=n;


  document
    .getElementById('court1')
    .style.background=
      n===1
      ?'#111827'
      :'#e5e7eb';


  document
    .getElementById('court1')
    .style.color=
      n===1
      ?'#fff'
      :'#111827';


  document
    .getElementById('court2')
    .style.background=
      n===2
      ?'#111827'
      :'#e5e7eb';


  document
    .getElementById('court2')
    .style.color=
      n===2
      ?'#fff'
      :'#111827';


  resetRecords();

}


/* =========================
   記録リセット
========================= */

function resetRecords(){

  rounds=[];

  pairCounts={};

  oppCounts={};

  playCounts={};

  byeCounts={};

  render();

}


/* =========================
   1日リセット
========================= */

function resetDay(){

  rounds=[];

  pairCounts={};

  oppCounts={};

  playCounts={};

  byeCounts={};

  render();

}


/* =========================
   試合数希望UI
========================= */

function renderPreferences(){

  const people=
    Array.from(selected)
    .sort((a,b)=>a-b);


  preferencesBox.innerHTML='';


  if(!people.length){

    return;

  }


  people.forEach(x=>{

    if(!preferences[x]){

      preferences[x]='normal';

    }


    const row=
      document.createElement('div');

    row.className='preference';


    row.innerHTML=`

      <div class="preference-name">
        ${x}番
      </div>

      <div class="preference-buttons">

        <button
          type="button"
          class="pref-btn ${
            preferences[x]==='light'
            ? 'active-light'
            : ''
          }"
          onclick="setPreference(${x},'light')"
        >
          少なめ
        </button>


        <button
          type="button"
          class="pref-btn ${
            preferences[x]==='normal'
            ? 'active-normal'
            : ''
          }"
          onclick="setPreference(${x},'normal')"
        >
          普通
        </button>


        <button
          type="button"
          class="pref-btn ${
            preferences[x]==='heavy'
            ? 'active-heavy'
            : ''
          }"
          onclick="setPreference(${x},'heavy')"
        >
          多め
        </button>

      </div>

    `;


    preferencesBox.appendChild(row);

  });

}


/* =========================
   試合数希望変更
========================= */

function setPreference(player,type){

  preferences[player]=type;


  /*
   * 希望を途中で変更した場合、
   * それまでの組み合わせとの整合性が
   * 取りづらくなるため、その日の記録をリセット
   */

  rounds=[];

  pairCounts={};

  oppCounts={};

  playCounts={};

  byeCounts={};


  renderPreferences();

  render();

}


/* =========================
   候補スコア
========================= */

function candidateScore(p,usable){

  let score=0;


  const playing=
    p.slice(0,usable);

  const bye=
    p.slice(usable);


  /*
   * =========================
   * 出場回数の基本バランス
   * =========================
   */

  playing.forEach(x=>{

    const games=
      playCounts[x]||0;


    /*
     * 少なめ
     *
     * 出場すること自体に
     * 強めのペナルティ
     */

    if(preferences[x]==='light'){

      score += games * 2200;

    }


    /*
     * 普通
     */

    else if(preferences[x]==='normal'){

      score += games * 1200;

    }


    /*
     * 多め
     *
     * 出場回数が増えるほど
     * スコアを下げるので
     * 選ばれやすくなる
     */

    else if(preferences[x]==='heavy'){

      score += games * 300;

    }

  });


  /*
   * =========================
   * 少なめ・普通・多めの
   * グループ間のバランス
   * =========================
   */

  const normalPlayers=
    p.filter(x=>
      preferences[x]==='normal'
    );


  const lightPlayers=
    p.filter(x=>
      preferences[x]==='light'
    );


  const heavyPlayers=
    p.filter(x=>
      preferences[x]==='heavy'
    );


  const averageGames=list=>{

    if(!list.length){

      return 0;

    }

    return list.reduce(
      (sum,x)=>
        sum+(playCounts[x]||0),
      0
    )/list.length;

  };


  const normalAvg=
    averageGames(normalPlayers);

  const lightAvg=
    averageGames(lightPlayers);

  const heavyAvg=
    averageGames(heavyPlayers);


  /*
   * 少なめは普通より
   * 少ない方向へ
   */

  if(lightPlayers.length){

    if(lightAvg>=normalAvg){

      score +=
        (lightAvg-normalAvg+1)
        *5000;

    }

  }


  /*
   * 多めは普通より
   * 多い方向へ
   */

  if(heavyPlayers.length){

    if(heavyAvg<=normalAvg){

      score +=
        (normalAvg-heavyAvg+1)
        *5000;

    }

  }


  /*
   * 少なめと多めの差も
   * 少し意識する
   */

  if(
    lightPlayers.length &&
    heavyPlayers.length
  ){

    if(lightAvg>=heavyAvg){

      score +=
        (lightAvg-heavyAvg+1)
        *3000;

    }

  }


  /*
   * =========================
   * 休みの偏り
   * =========================
   */

  bye.forEach(x=>{

    score +=
      (byeCounts[x]||0)*300;

  });


  /*
   * =========================
   * 3連続休みをできるだけ回避
   *
   * 「絶対禁止」ではない
   * =========================
   */

  for(const x of bye){

    const lastRound=
      rounds[rounds.length-1];

    const secondLastRound=
      rounds[rounds.length-2];

    const thirdLastRound=
      rounds[rounds.length-3];


    const lastBye=
      lastRound &&
      lastRound.bye.includes(x);


    const secondLastBye=
      secondLastRound &&
      secondLastRound.bye.includes(x);


    const thirdLastBye=
      thirdLastRound &&
      thirdLastRound.bye.includes(x);


    /*
     * 2連続休みになる候補
     */

    if(
      lastBye &&
      secondLastBye
    ){

      score+=100000;

    }


    /*
     * 3連続休みになる候補は
     * さらに強く避ける
     */

    if(
      lastBye &&
      secondLastBye &&
      thirdLastBye
    ){

      score+=300000;

    }

  }


  /*
   * =========================
   * 少なめの人は
   * 連続出場も少し避ける
   * =========================
   */

  playing.forEach(x=>{

    if(
      preferences[x]==='light'
    ){

      const lastRound=
        rounds[rounds.length-1];


      if(lastRound){

        const playedLast=
          lastRound.matches.some(m=>
            m.flat().includes(x)
          );


        if(playedLast){

          score+=700;

        }

      }

    }

  });


  /*
   * ランダム性
   */

  score +=
    Math.random()*80;


  return score;

}


/* =========================
   試合候補作成
========================= */

function makeCandidate(people){

  const n=people.length;


  const maxCourts=
    Math.min(
      courtCount,
      Math.floor(n/4)
    );


  const usable=
    maxCourts*4;


  let best=null;

  let bestScore=
    Infinity;


  /*
   * 5000パターンから
   * 一番バランスの良いものを探す
   */

  for(let t=0;t<5000;t++){

    const p=
      shuffle(people);


    const matches=[];

    const bye=
      p.slice(usable);


    /*
     * コートごとの組み合わせ
     */

    for(
      let i=0;
      i<usable;
      i+=4
    ){

      matches.push([
        [p[i],p[i+1]],
        [p[i+2],p[i+3]]
      ]);

    }


    let score=
      candidateScore(
        p,
        usable
      );


    /*
     * =========================
     * 同じペアを避ける
     * =========================
     */

    for(const m of matches){

      const [a,b]=m[0];

      const [c,d]=m[1];


      score +=
        (pairCounts[key(a,b)]||0)
        *10000;


      score +=
        (pairCounts[key(c,d)]||0)
        *10000;


      /*
       * =========================
       * 同じ相手との対戦を避ける
       * =========================
       */

      for(
        const [x,y]
        of [
          [a,c],
          [a,d],
          [b,c],
          [b,d]
        ]
      ){

        score +=
          (oppCounts[key(x,y)]||0)
          *1600;

      }

    }


    /*
     * =========================
     * 同じ4人を避ける
     * =========================
     */

    const groupKeys=
      matches.map(m=>
        m.flat()
        .sort((a,b)=>a-b)
        .join('-')
      );


    for(const g of groupKeys){

      const previous=
        rounds.some(r=>
          r.matches.some(m=>
            m.flat()
            .sort((a,b)=>a-b)
            .join('-')===g
          )
        );


      if(previous){

        score+=2500;

      }

    }


    /*
     * =========================
     * 一番良い候補を保存
     * =========================
     */

    if(score<bestScore){

      bestScore=score;

      best={
        matches,
        bye
      };

    }

  }


  return best;

}


/* =========================
   次の試合を作る
========================= */

function nextMatch(){

  const people=
    Array.from(selected)
    .sort((a,b)=>a-b);


  const out=
    document.getElementById('result');


  if(people.length<4){

    out.innerHTML=
      '<div class="empty">4人以上選んでください。</div>';

    return;

  }


  /*
   * 初期値を設定
   */

  people.forEach(x=>{

    if(playCounts[x]==null){

      playCounts[x]=0;

    }


    if(byeCounts[x]==null){

      byeCounts[x]=0;

    }


    if(!preferences[x]){

      preferences[x]='normal';

    }

  });


  /*
   * 最適候補を作る
   */

  const r=
    makeCandidate(people);


  rounds.push(r);


  /*
   * 出場回数・ペア・対戦履歴を記録
   */

  r.matches.forEach(m=>{

    m.flat().forEach(x=>{

      playCounts[x]++;

    });


    const [a,b]=m[0];

    const [c,d]=m[1];


    /*
     * ペア回数
     */

    pairCounts[key(a,b)]=
      (pairCounts[key(a,b)]||0)+1;


    pairCounts[key(c,d)]=
      (pairCounts[key(c,d)]||0)+1;


    /*
     * 対戦回数
     */

    [
      [a,c],
      [a,d],
      [b,c],
      [b,d]
    ].forEach(([x,y])=>{

      oppCounts[key(x,y)]=
        (oppCounts[key(x,y)]||0)+1;

    });

  });


  /*
   * 休み回数
   */

  r.bye.forEach(x=>{

    byeCounts[x]=
      (byeCounts[x]||0)+1;

  });


  render();

}


/* =========================
   表示
========================= */

function render(){

  const out=
    document.getElementById('result');


  if(!rounds.length){

    out.innerHTML=
      '<div class="empty">参加者を選んで「次の試合を作る」を押してください。</div>';

    return;

  }


  let html='';


  /*
   * 最新の試合を上に表示
   */

  rounds
    .slice()
    .reverse()
    .forEach(
      (r,reverseIndex)=>{

        const i=
          rounds.length
          -1
          -reverseIndex;


        html+=`
          <div class="match">

            <div class="match-title">
              第${i+1}試合
            </div>
        `;


        r.matches.forEach(
          (m,idx)=>{

            html+=`

              <div style="
                font-size:12px;
                color:#6b7280;
                margin:${idx?'10px':'0'}px 0 6px
              ">
                コート${idx+1}
              </div>

              <div class="court">

                <div class="team">
                  ${m[0][0]}・${m[0][1]}
                </div>

                <div class="vs">
                  VS
                </div>

                <div class="team">
                  ${m[1][0]}・${m[1][1]}
                </div>

              </div>

            `;

          }
        );


        if(r.bye.length){

          html+=`

            <div class="bye">
              休み：${r.bye.join('・')}
            </div>

          `;

        }


        html+=`
          </div>
        `;

      }
    );


  /*
   * =========================
   * 試合数表示
   * =========================
   */

  html+=`

    <div class="history">

      <span class="pill">
        試合数：${rounds.length}
      </span>

  `;


  const vals=
    Array.from(selected)
    .sort((a,b)=>a-b)
    .map(x=>{

      let label='普通';


      if(preferences[x]==='light'){

        label='少なめ';

      }

      if(preferences[x]==='heavy'){

        label='多め';

      }


      return `${x}: ${playCounts[x]||0}試合（${label}）`;

    })
    .join('　');


  html+=`

      <span class="pill">
        ${vals}
      </span>

    </div>

  `;


  out.innerHTML=html;

}


/* =========================
   初期表示
========================= */

renderPreferences();

render();

</script>

</body>
</html>
